[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modnet-pt"
version = "0.1.0a0"
description = "PyTorch rewrite of MODNet with a scikit-learn-style DataFrame API (no MODData)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Rogério Gouvêa" }]
keywords = ["materials-informatics", "machine-learning", "pytorch", "soap", "descriptors"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.0",
    "matminer>=0.9",
    "pymatgen>=2023.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff"]

[project.urls]
Upstream = "https://github.com/matgenix/modnet"

[tool.setuptools.packages.find]
include = ["modnet_pt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
